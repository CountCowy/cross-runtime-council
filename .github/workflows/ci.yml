name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Deterministic suites only. The live recovery matrix requires signed
    # vendor runtimes and interactive sessions that do not exist on runners;
    # it is a maintainer-run release gate, never CI (see README).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Python static analysis
        run: |
          python3 -m pip install --quiet ruff==0.6.9
          python3 -m ruff check .
      - name: Python suite
        run: python3 test_council.py
        working-directory: scripts
      - name: Representation parity suite
        run: python3 test_parity.py
        working-directory: scripts
      - name: Deletion x recovery crash harness
        run: python3 test_deletion_crash.py
        working-directory: scripts
      - name: Recovery invariant oracles
        run: python3 test_recovery_invariants.py
        working-directory: scripts
      - name: Deterministic crash matrix
        run: python3 test_crash_matrix.py
        working-directory: scripts
      - name: TypeScript type-check
        run: |
          npm install --no-save --silent typescript@5.6.3 "@opencode-ai/plugin@1.18.21" "@types/node@22.7.5"
          npx tsc --noEmit
      - name: Node suite
        run: node --experimental-strip-types --test test_opencode_delivery_registry.ts
        working-directory: scripts
      - name: Lifecycle script syntax
        run: for f in install/*.sh; do sh -n "$f"; done
      - name: Example decision-packet digest binding
        run: shasum -a 256 -c final.json.sha256
        working-directory: examples/v020-verification-depth
      - name: Example packet renders (the README command)
        run: |
          python3 scripts/council.py render \
            --input examples/v020-verification-depth/final.json \
            --expect-sha256 "$(awk '{print $1}' examples/v020-verification-depth/final.json.sha256)" \
            --output /tmp/packet-check.html

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
